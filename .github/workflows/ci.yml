name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # The derivations are checked against EIP-1014's own vectors and against
      # @solana/web3.js output, so a change that breaks either fails here
      # rather than at a launch.
      - run: npm test
